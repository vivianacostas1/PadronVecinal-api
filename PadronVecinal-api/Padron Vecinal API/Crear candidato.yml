info:
  name: Crear candidato
  type: http

http:
  method: POST
  url: http://localhost:3001/api/candidatos
  body:
    type: json
    data: |-
      {
        "planchaId": 1,
        "cargoId": 1,
        "vecinoId": 12
      }
